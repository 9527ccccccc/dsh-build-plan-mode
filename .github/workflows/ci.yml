# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d7c243d97f6a1bcd4cbd9e8a1be # v4
        with:
          node-version: 22
      - name: Build and test
        run: |
          npm run build
          npm test
      - name: Verify committed lib matches the build (byte-fresh artifacts)
        run: git diff --exit-code -- lib

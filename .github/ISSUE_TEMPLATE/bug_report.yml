# SPDX-License-Identifier: MIT
name: Bug report
description: Report reproducible plugin behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste credentials, private Session content, user profile files, or unredacted local paths.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal, sanitized steps.
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      placeholder: 0.1.1-rc.2
      description: Output of `dsh --version` or the installed @deepseek-ai/dsh version.
    validations:
      required: true
  - type: input
    id: plugin-commit
    attributes:
      label: Plugin version or commit
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Affected mode
      options: [Build, Plan, Both, Unknown]
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Remove credentials, Session content, usernames, and absolute paths before submitting.
